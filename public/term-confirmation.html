<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a5f67" />
    <title>تأكيد فتح فصل دراسي جديد</title>
    <style>
      :root {
        --bg: #f4f8f9;
        --card: #ffffff;
        --primary: #0a5f67;
        --primary-soft: #dff4f5;
        --danger: #ba3b3b;
        --text: #1a2a2d;
        --muted: #5d7176;
        --border: #dfe7ea;
        --success: #1f8a5d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #edf6f7 0%, var(--bg) 100%);
        font-family: "Segoe UI", Tahoma, sans-serif;
        color: var(--text);
      }
      .page {
        width: min(100%, 720px);
        padding: 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 18px 45px rgba(14, 64, 74, 0.08);
        overflow: hidden;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px 24px;
        background: linear-gradient(135deg, var(--primary-soft), #f1f7f9);
        border-bottom: 1px solid var(--border);
      }
      .brand {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: var(--primary);
        display: grid;
        place-items: center;
        color: white;
        font-weight: 700;
        font-size: 25px;
      }
      .header h1 {
        margin: 0;
        font-size: clamp(1.6rem, 2vw, 2.1rem);
      }
      .content {
        padding: 24px;
      }
      .status {
        margin: 0 0 18px;
        padding: 12px 14px;
        border-radius: 12px;
        background: #f7f9fa;
        color: var(--muted);
      }
      .status.error {
        background: #fff1f1;
        color: var(--danger);
        border: 1px solid #f3d1d1;
      }
      .status.success {
        background: #ecfdf5;
        color: var(--success);
        border: 1px solid #c8ebdc;
      }
      .details {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
        margin-top: 14px;
      }
      .detail {
        background: #f8fafb;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
      }
      .detail label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .detail strong {
        font-size: 1rem;
      }
      .actions {
        margin-top: 20px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      button {
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      .primary {
        background: var(--primary);
        color: #fff;
      }
      .secondary {
        background: #edf3f5;
        color: var(--text);
      }
      .muted {
        color: var(--muted);
      }
      @media (max-width: 560px) {
        .page { padding: 14px; }
        .header { padding: 16px 18px; }
        .content { padding: 18px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-live="polite">
        <header class="header">
          <div class="brand">✓</div>
          <div>
            <h1>تأكيد فتح فصل دراسي جديد</h1>
            <div class="muted">لا يتم تنفيذ الأرشفة إلا بعد تأكيد الرابط المرسل عبر البريد</div>
          </div>
        </header>
        <div class="content">
          <div id="status" class="status">جارٍ التحقق من رابط التأكيد…</div>
          <section id="request-panel" hidden>
            <div class="details">
              <div class="detail"><label>اسم المدرسة</label><strong id="school-name">—</strong></div>
              <div class="detail"><label>الفصل الحالي</label><strong id="current-term">—</strong></div>
              <div class="detail"><label>الفصل المستهدف</label><strong id="target-term">—</strong></div>
              <div class="detail"><label>تاريخ انتهاء الرابط</label><strong id="expires-at">—</strong></div>
            </div>
            <div class="actions">
              <button id="confirm-button" class="primary" type="button">تأكيد الأرشفة وفتح الفصل</button>
              <button id="cancel-button" class="secondary" type="button">إغلاق</button>
            </div>
          </section>
          <section id="success-panel" hidden>
            <div class="status success">تم تأكيد الأرشفة بنجاح، وجاري تنفيذ فتح الفصل الجديد…</div>
          </section>
        </div>
      </section>
    </main>
    <script type="module" src="/term-confirmation.js"></script>
  </body>
</html>
