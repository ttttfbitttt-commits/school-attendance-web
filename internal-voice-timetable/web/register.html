<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب | الجدول الصوتي</title><link rel="stylesheet" href="/auth.css?v=1"></head><body><main class="auth-shell"><section class="auth-card"><a class="brand" href="/landing.html"><img src="/assets/voice-table-logo.png?v=1" alt="شعار الجدول الصوتي"><span>الجدول الصوتي<small>مساحة مستقلة لمدرستك</small></span></a><h1>أنشئ حساب مدرستك</h1><p>استخدم بريدًا إلكترونيًا صالحًا. سنرسل إليه رسالة تأكيد قبل فتح مساحة المدرسة.</p><form id="registerForm"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" required><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">تأكيد كلمة المرور</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button class="button" type="submit">إنشاء الحساب وإرسال التفعيل</button></form><div id="message" class="message" role="status"></div><a class="switch" href="/login.html">لديك حساب؟ تسجيل الدخول</a><a class="back" href="/landing.html">العودة إلى الصفحة التعريفية</a></section></main><script src="/auth.js?v=1"></script></body></html>
