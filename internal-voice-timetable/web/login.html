<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | الجدول الصوتي</title><link rel="stylesheet" href="/auth.css?v=1"></head><body><main class="auth-shell"><section class="auth-card"><a class="brand" href="/landing.html"><img src="/assets/voice-table-logo.png?v=1" alt="شعار الجدول الصوتي"><span>الجدول الصوتي<small>آمرني وأنا أنفذ</small></span></a><h1>مرحبًا بعودتك</h1><p>سجّل الدخول للوصول إلى مساحة مدرستك وجداولها.</p><form id="loginForm"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" required><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button class="button" type="submit">تسجيل الدخول</button><button id="resend" class="button secondary" type="button" hidden>إعادة إرسال التفعيل</button></form><div id="message" class="message" role="status"></div><a class="switch" href="/register.html">ليس لديك حساب؟ إنشاء حساب</a><a class="back" href="/landing.html">العودة إلى الصفحة التعريفية</a></section></main><script src="/auth.js?v=1"></script></body></html>
