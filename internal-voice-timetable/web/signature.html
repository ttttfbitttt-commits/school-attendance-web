<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>توقيع تكليف الانتظار</title><link rel="stylesheet" href="/signature.css?v=1"></head><body><main><header><img src="/assets/voice-table-logo.png?v=1" alt="الجدول الصوتي"><div><b>الجدول الصوتي</b><small>توقيع تكليف الانتظار</small></div></header><section id="loading">جارٍ تحميل التكليف…</section><section id="task" hidden><p class="school" id="school"></p><h1>تكليف انتظار</h1><div class="grid"><p><span>المعلم المنتظر</span><b id="teacher"></b></p><p><span>المعلم الغائب</span><b id="absent"></b></p><p><span>اليوم والتاريخ</span><b id="date"></b></p><p><span>الحصة والوقت</span><b id="period"></b></p><p><span>الفصل</span><b id="class"></b></p><p><span>المادة</span><b id="subject"></b></p></div><p class="notice">أقرّ باطلاعي على هذا التكليف وتنفيذه، وأوقّع أدناه بخط يدي.</p><label>التوقيع</label><div class="canvasWrap"><canvas id="signature" width="900" height="300"></canvas></div><div class="actions"><button id="clear" class="secondary">مسح التوقيع</button><button id="send">اعتماد وإرسال التوقيع</button></div><p id="message" role="status"></p></section></main><script type="module" src="/signature.js?v=1"></script></body></html>
