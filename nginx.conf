server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com data:" always;
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # النسخة المضمنة من الجدول الصوتي: المصادقة هنا من جلسة نظام الحصر فقط.
  location = /voice-table { return 302 /voice-table/; }
  # روابط التوقيع عامة عمدًا: رمز التوقيع الطويل هو التفويض، ولا يمنح الوصول للمدرسة.
  location ~ ^/voice-table/(signature\.html|signature\.css|signature\.js|assets/.*|api/signature-(task|submit))$ {
    rewrite ^/voice-table/(.*)$ /$1 break;
    proxy_pass http://voice-timetable:8767;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    sub_filter_once off;
    sub_filter_types text/html text/css application/javascript text/javascript;
    sub_filter '"/' '"/voice-table/';
    sub_filter "'/" "'/voice-table/";
    add_header Cache-Control "no-store" always;
  }
  location /voice-table/ {
    auth_request /api/internal/voice-auth;
    auth_request_set $voice_school_id $upstream_http_x_voice_school_id;
    auth_request_set $voice_user_id $upstream_http_x_voice_user_id;
    proxy_pass http://voice-timetable:8767/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Voice-School-Id $voice_school_id;
    proxy_set_header X-Voice-User-Id $voice_user_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /voice-table;
    proxy_redirect / /voice-table/;
    # أصل التطبيق يستخدم روابط جذرية؛ نعيد توجيهها داخل هذا المسار فقط.
    sub_filter_once off;
    sub_filter_types text/html text/css application/javascript text/javascript;
    sub_filter '"/' '"/voice-table/';
    sub_filter "'/" "'/voice-table/";
    add_header Cache-Control "no-store" always;
  }
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com data:" always;
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com data:" always;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
